# glob 9.0.0-14.0.1 AbortSignal cancellation bypass: an aborted async walk keeps
# reading directories in the background (published 2026-10-30, CVE-2026-118773). No in-major fix
# exists: glob 10.5.0 and 13.0.6 are the newest 10.x and 13.x releases, and the
# first fixed release is 14.0.2. A cross-major override is not safe for callers.
# Exposure review (2026-10-31): no application code imports glob. Versions in the
# lockfile and how they arrive (`pnpm why glob -r`, `--prod`):
#   - glob 10.5.0: jest 30 (@jest/reporters, jest-config, jest-runtime) and
#     ts-jest, backend devDependencies only (test runner).
#   - glob 13.0.6 via @nestjs/cli: backend devDependency (nest build tooling).
#   - glob 13.0.6 via @sentry/nextjs -> @sentry/bundler-plugins (frontend and
#     mobile dependencies). This is the only chain that shows under --prod. The
#     plugin is loaded only by @sentry/nextjs's withSentryConfig/next.config build
#     hooks (runAfterProductionCompile, webpack plugin, component annotation
#     loader), and its glob patterns come from developer-authored sourcemap
#     config. After `next build` of the frontend, no `.next/**/*.nft.json` runtime
#     trace contains bundler-plugins, glob or minimatch, so the deployed
#     artefact does not load them. The latest @sentry/bundler-plugins (11.10.0)
#     still pins glob ^13.0.6, so there is no upstream fix to adopt yet.
#   - glob 7.2.3 (jest 29) is outside the affected range (introduced 9.0.0).
# No untrusted input reaches a glob walk or an AbortSignal timeout. OSV ignores
# by id, so this one entry covers every glob version above; each passed the review.
# Revisit when glob >=14.0.2 is reachable through jest/nest/sentry (then bump and
# drop this entry), or when the expiry above lapses.
reason = "No in-major glob fix exists; only reachable via jest/nest build tooling and @sentry/nextjs build hooks with developer-authored patterns, not production runtime or untrusted input."

