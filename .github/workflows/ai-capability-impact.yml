name: AI capability impact

on:
  pull_request:
    paths:
      - "backend/application/agent/**"
      - "backend/application/usecases/**/*agent-capabilities*"
      - "backend/agent-manifest.json"
      - "backend/scripts/agent/**"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish informational capability diff
        run: |
          set -o pipefail
          pnpm --filter ./backend exec ts-node scripts/agent/impact-report.ts | tee "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
