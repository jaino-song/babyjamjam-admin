name: Backend CI

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only manual operation
        required: false
        default: ci
        type: choice
        options:
          - ci
          - lightnode-status
  push:
    branches: [ main, dev, preview, "feature/**", "fix/**", "ci/**" ]
    paths:
      - 'backend/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/backend-ci.yml'
  # No paths filter on pull_request: this job is a REQUIRED check on dev,
  # so it must report on every PR — path-filtered required checks block
  # merges as eternally "expected" when the paths don't match.
  pull_request:
    branches: [ main, dev, preview, "feature/**", "fix/**", "ci/**" ]
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    name: backend · type-check · lint · test
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'lightnode-status'
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # Throwaway Postgres used ONLY as prisma's shadow database for the
    # migrations drift guard below — never seeded, never read by tests.
    # trust auth: no password exists at all (ephemeral localhost container).
    services:
      postgres:
        image: postgres@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109 # postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # database-patches.yml re-executes its whole migration block on every push, so a
      # statement that raises on its second run aborts the step and silently stops every
      # LATER migration from ever applying — which is how add_scheduler_lease kept
      # add_employee_schedule_terminated_at out of the dev database while the code that
      # reads that column was already merged.
      #
      # This gate sits in the required job on purpose. The sibling workflow-contract test
      # (which checks that every migration is WIRED) runs only in `shared contracts` and
      # `backend full flow e2e`, and neither is a required check on dev, preview or main —
      # so a violation there reports red and merges anyway.
      - name: Migration idempotency gate
        run: node --test scripts/ci/migration-idempotency.test.mjs

      - name: Verify vendored shared runtime
        run: |
          pnpm --filter @babyjamjam/shared run build:backend-runtime
          git diff --exit-code -- backend/vendor/shared-agent
          untracked="$(git ls-files --others --exclude-standard backend/vendor/shared-agent)"
          if [ -n "$untracked" ]; then
            echo "Generated shared runtime files are not committed:"
            echo "$untracked"
            exit 1
          fi

      # Fail fast on the cheapest, most deterministic gate first.
      - name: Type check
        run: pnpm --filter ./backend run type-check

      - name: Build
        run: pnpm --filter ./backend run build

      - name: Verify pdf rasterizer (pdfjs + napi-canvas on the built output)
        run: pnpm --filter ./backend run verify:pdf-rasterizer

      - name: Agent capability manifest and drift gates
        run: pnpm --filter ./backend run agent:manifest:check

      - name: Protect legacy surfaces until D13 cutover evidence is complete
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: pnpm --filter ./backend run agent:cutover:guard
        env:
          AGENT_RELEASE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AGENT_CUTOVER_MANIFEST_JSON: ${{ secrets.AGENT_CUTOVER_MANIFEST_JSON }}

      - name: Protect legacy surfaces without protected evidence on pull requests or merge queue
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: pnpm --filter ./backend run agent:cutover:guard
        env:
          AGENT_RELEASE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lint
        run: pnpm --filter ./backend run lint

      - name: Verify backend deployment automation contracts
        run: |
          backend/deploy/lightsail/ci-automation-contract.test.sh
          backend/deploy/lightsail/lightsail-cli.test.sh
          backend/deploy/fallback-server/contract.test.sh
          backend/deploy/fallback-server/production-db-identity.test.sh
          bash backend/deploy/fallback-server/controller/contract.test.sh
          bash backend/deploy/fallback-server/controller/test-all.sh
          backend/deploy/fallback-server/ci/workflow-contract.test.sh
          backend/deploy/fallback-server/ci/ci-deployer-contract.test.sh
          backend/deploy/ci/wait-database-patches.test.sh
          node --test backend/deploy/fallback-server/ci/*.test.mjs backend/deploy/cloudrun/*.test.mjs

      # pdfjs-dist is ESM-only and its Jest VM import can outlive a neighboring
      # CommonJS test environment when both suites share a worker. Keep the
      # strict installed-pdf proof in its own Jest process; the regular unit
      # command still runs every other configured unit suite and retains all
      # existing e2e/runtime exclusions.
      - name: Receipt PDF verifier unit test
        run: pnpm --filter ./backend test --runTestsByPath test/services/receipt-pdf-verifier.service.spec.ts --runInBand
        env:
          CI: true

      - name: Unit tests
        run: >-
          pnpm --filter ./backend test
          --testPathIgnorePatterns=/node_modules/
          --testPathIgnorePatterns=/dist/
          --testPathIgnorePatterns='<rootDir>/test/e2e/'
          --testPathIgnorePatterns='<rootDir>/test/auth-e2e/'
          --testPathIgnorePatterns='<rootDir>/test/agent-e2e/runtime/'
          --testPathIgnorePatterns='<rootDir>/test/services/receipt-pdf-verifier\.service\.spec\.ts'
        env:
          CI: true

      # Fails when schema.prisma changed without a corresponding migration.
      # Replays prisma/migrations into the throwaway shadow DB and diffs the
      # result against the schema — exit 2 on drift.
      - name: Migrations drift guard
        run: >-
          pnpm --filter ./backend exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "postgresql://postgres@localhost:5432/postgres"
          --exit-code

  auth-e2e:
    name: auth e2e · ${{ matrix.tenant_isolation_mode }} · postgres · valkey · mailpit
    needs: verify
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # observe mirrors production today; enforce is the pre-flip regression gate
        # (spec: docs/superpowers/specs/2026-09-01-call-inbox-productionization-design.md §5.1)
        tenant_isolation_mode: [observe, enforce]
    env:
      CI: true
      NODE_ENV: test
      TENANT_ISOLATION_MODE: ${{ matrix.tenant_isolation_mode }}
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres@localhost:5432/postgres
      VALKEY_URL: redis://localhost:6379
      JWT_SECRET: e2e-dummy-jwt-signing-key-at-least-32-${{ github.run_id }}
      AUTH_EMAIL_TOKEN_HMAC_SECRET: e2e-dummy-email-hmac-${{ github.run_id }}
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      E2E_VENDOR_STUBS: '1'
      DEVELOPMENT_FRONTEND_URL: http://localhost:3000
      DEVELOPMENT_MOBILE_FRONTEND_URL: http://localhost:3002
      STORAGE_BOOTSTRAP_DISABLED: '1'
    services:
      postgres:
        image: postgres@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109 # postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Task persistence tests enforce this exact disposable database identity.
      # Keep it separate from the auth fixtures and general agent runtime tests.
      conversation-postgres:
        image: postgres@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109 # postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: bjj_test
          POSTGRES_DB: bjj_conversation_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U bjj_test -d bjj_conversation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey@sha256:e0eb7c480958d32bdc4357a74bdd70653ae15f2f9b4c93c4a5a9fad1dc471c84 # valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68 # axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm --filter ./backend run db:migrate:deploy
      - name: Seed isolated auth fixtures
        run: pnpm --filter ./backend run db:seed:auth-e2e
      - name: Run real auth and tenant E2E
        run: pnpm --filter ./backend run test:auth-e2e

      - name: Run deterministic agent runtime E2E
        run: >-
          pnpm --filter ./backend run test:agent-e2e
          --testPathIgnorePatterns='test/agent-e2e/runtime/agent-task-.*\.e2e\.spec\.ts$'
        env:
          AGENT_E2E: '1'
          AGENT_ENABLED: 'true'
          AGENT_READ_ENABLED: 'true'
          AGENT_RATE_LIMIT_PER_MINUTE: '100'

      - name: Apply isolated conversation task migrations
        run: pnpm --filter ./backend run db:migrate:deploy
        env:
          DATABASE_URL: postgresql://bjj_test@127.0.0.1:55433/bjj_conversation_test
          DIRECT_URL: postgresql://bjj_test@127.0.0.1:55433/bjj_conversation_test

      # The positive selector must match the exclusion above exactly. Both steps
      # are required, so no task suite is skipped by the database partition.
      - name: Run isolated conversation task E2E
        run: >-
          pnpm --filter ./backend run test:agent-e2e
          --testPathPatterns='test/agent-e2e/runtime/agent-task-.*\.e2e\.spec\.ts$'
        env:
          DATABASE_URL: postgresql://bjj_test@127.0.0.1:55433/bjj_conversation_test
          DIRECT_URL: postgresql://bjj_test@127.0.0.1:55433/bjj_conversation_test
          AGENT_E2E: '1'

  lightnode-connection-smoke:
    name: LightNode CI connection smoke
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'lightnode-status'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LIGHTNODE_CI_HOST: ${{ secrets.LIGHTNODE_CI_HOST }}
      LIGHTNODE_CI_SSH_PRIVATE_KEY: ${{ secrets.LIGHTNODE_CI_SSH_PRIVATE_KEY }}
      LIGHTNODE_CI_KNOWN_HOSTS: ${{ secrets.LIGHTNODE_CI_KNOWN_HOSTS }}

    steps:
      - name: Connect an ephemeral diagnostic node to the tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: babyjamjam-backend-ci-smoke

      - name: Verify restricted LightNode status
        run: |
          set -euo pipefail
          [[ "$LIGHTNODE_CI_HOST" =~ ^[A-Za-z0-9.-]{1,253}$ ]]
          [[ -n "$LIGHTNODE_CI_SSH_PRIVATE_KEY" && -n "$LIGHTNODE_CI_KNOWN_HOSTS" ]]
          umask 077
          install -d "$RUNNER_TEMP/lightnode-ssh"
          printf '%s\n' "$LIGHTNODE_CI_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/lightnode-ssh/id"
          printf '%s\n' "$LIGHTNODE_CI_KNOWN_HOSTS" > "$RUNNER_TEMP/lightnode-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/lightnode-ssh/id" >/dev/null
          ssh-keygen -F "$LIGHTNODE_CI_HOST" -f "$RUNNER_TEMP/lightnode-ssh/known_hosts" >/dev/null
          status_output="$(ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/lightnode-ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -i "$RUNNER_TEMP/lightnode-ssh/id" \
            "babyjamjam-ci-deployer@$LIGHTNODE_CI_HOST" \
            status)"
          read_status_value() {
            local wanted_key="$1"
            awk -F= -v wanted_key="$wanted_key" '$1 == wanted_key { print substr($0, length($1) + 2) }' \
              <<<"$status_output"
          }
          [[ "$(read_status_value environment)" == "fallback-server" ]]
          [[ "$(read_status_value runtime_mode)" == "temporary-active" ]]
          [[ "$(read_status_value container_health)" == "healthy" ]]
          [[ "$(read_status_value restart_count)" == "0" ]]
          [[ "$(read_status_value production_db_identity)" == "ok" ]]
          [[ "$(read_status_value public_routing)" == "fallback" ]]
          [[ "$(read_status_value schedulers_enabled)" == "true" ]]
          printf '%s\n' \
            "environment=fallback-server" \
            "container_health=healthy" \
            "restart_count=0" \
            "runtime_mode=temporary-active" \
            "public_routing=fallback" \
            "schedulers_enabled=true"

  build-lightsail-image:
    name: build immutable Lightsail image
    if: github.event_name == 'push' && (github.ref_name == 'preview' || github.ref_name == 'main')
    needs: [verify, auth-e2e]
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: lightsail-image-${{ github.ref_name }}
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and publish commit image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: backend/Dockerfile.lightsail
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jaino-song/babyjamjam-admin-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend-lightsail
          cache-to: type=gha,mode=max,scope=backend-lightsail
          provenance: true
          sbom: true

  wait-database-patches:
    name: wait for database patches
    if: github.event_name == 'push' && (github.ref_name == 'preview' || github.ref_name == 'main')
    needs: build-lightsail-image
    timeout-minutes: 150
    runs-on: ubuntu-latest
    concurrency:
      group: backend-deploy-wait-${{ github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Wait for the Database Patches run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash backend/deploy/ci/wait-database-patches.sh

  resolve-backend-deploy-target:
    name: resolve backend deployment target
    if: >-
      always() &&
      github.event_name == 'push' &&
      (github.ref_name == 'preview' || github.ref_name == 'main') &&
      needs.build-lightsail-image.result == 'success' &&
      needs.wait-database-patches.result == 'success'
    needs: [build-lightsail-image, wait-database-patches]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
    env:
      DEPLOY_REF_NAME: ${{ github.ref_name }}
      FALLBACK_DNS_SHA256: ${{ secrets.FALLBACK_DNS_SHA256 }}
      LIGHTSAIL_DNS_SHA256: ${{ secrets.LIGHTSAIL_DNS_SHA256 }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve the exclusive backend target
        id: resolve
        run: node backend/deploy/fallback-server/ci/resolve-deploy-target.mjs >> "$GITHUB_OUTPUT"

  deploy-cloudrun:
    name: deploy Cloud Run preview backend
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref_name == 'preview' &&
      needs.build-lightsail-image.result == 'success' &&
      needs.wait-database-patches.result == 'success' &&
      needs.resolve-backend-deploy-target.result == 'success' &&
      needs.resolve-backend-deploy-target.outputs.target == 'cloudrun'
    needs: [build-lightsail-image, wait-database-patches, resolve-backend-deploy-target]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    concurrency:
      group: deploy-cloudrun-preview
      cancel-in-progress: false
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: asia-northeast3
      CLOUD_RUN_SERVICE: babyjamjam-api-preview
      IMAGE_DIGEST: ${{ needs.build-lightsail-image.outputs.digest }}
      GHCR_IMAGE: ghcr.io/jaino-song/babyjamjam-admin-backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_PREVIEW_DEPLOYER_SA: ${{ vars.GCP_PREVIEW_DEPLOYER_SA }}
        run: |
          set -euo pipefail
          if [[ -z "$GCP_PROJECT_ID" || -z "$GCP_WIF_PROVIDER" || -z "$GCP_PREVIEW_DEPLOYER_SA" ]]; then
            echo "::error::GCP bootstrap not done — see docs/plans/2026-09-23-preview-cloud-run.md"
            exit 1
          fi
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_DEPLOYER_SA }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Artifact Registry docker credential helper
        run: |
          set -euo pipefail
          gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Copy the commit image to Artifact Registry
        run: |
          set -euo pipefail
          ar_image="asia-northeast3-docker.pkg.dev/${GCP_PROJECT_ID}/babyjamjam/backend"
          docker buildx imagetools create --tag "${ar_image}:${GITHUB_SHA}" "${GHCR_IMAGE}@${IMAGE_DIGEST}"
          ar_digest="$(docker buildx imagetools inspect "${ar_image}:${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)"
          if [[ "$ar_digest" != "$IMAGE_DIGEST" ]]; then
            echo "::error::Artifact Registry digest mismatch — copied '$ar_digest', built '$IMAGE_DIGEST'"
            exit 1
          fi
          {
            echo "AR_IMAGE=${ar_image}"
            echo "AR_DIGEST=${ar_digest}"
          } >> "$GITHUB_ENV"

      - name: Render the Knative manifest and replace the Cloud Run service
        run: |
          set -euo pipefail
          IMAGE="${AR_IMAGE}@${AR_DIGEST}" PROJECT_ID="$GCP_PROJECT_ID" \
            envsubst '${IMAGE} ${PROJECT_ID}' \
            < backend/deploy/cloudrun/service.preview.yaml \
            > "$RUNNER_TEMP/service.yaml"
          if grep -Fq -- '${' "$RUNNER_TEMP/service.yaml"; then
            echo "::error::Rendered service manifest still contains an unresolved placeholder"
            exit 1
          fi
          # `services replace` blocks until the new revision is ready or the
          # operation fails, so the invariant checks below observe a settled service.
          gcloud run services replace "$RUNNER_TEMP/service.yaml" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION"

      - name: Verify the deployed service invariants
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json)"

          fail_check() {
            echo "::error::$1 (actual: $2)"
            exit 1
          }

          latest_created="$(jq -r '.status.latestCreatedRevisionName // ""' <<<"$service_json")"
          latest_ready="$(jq -r '.status.latestReadyRevisionName // ""' <<<"$service_json")"
          ready_condition="$(jq -r '.status.conditions[]? | select(.type == "Ready") | .status' <<<"$service_json")"
          [[ -n "$latest_created" ]] \
            || fail_check "latest created revision is missing" "absent"
          [[ "$latest_ready" == "$latest_created" ]] \
            || fail_check "latest ready revision must equal the latest created revision" "$latest_ready != $latest_created"
          [[ "$ready_condition" == "True" ]] \
            || fail_check "service Ready condition must be True" "${ready_condition:-absent}"

          traffic_percent="$(jq -r --arg revision "$latest_ready" \
            '[.status.traffic[]? | select(.revisionName == $revision) | .percent] | add // 0' \
            <<<"$service_json")"
          [[ "$traffic_percent" == "100" ]] \
            || fail_check "100% of traffic must be on the latest ready revision" "${traffic_percent}% on $latest_ready"

          expected_image="${AR_IMAGE}@${AR_DIGEST}"
          deployed_image="$(jq -r '.spec.template.spec.containers[0].image // ""' <<<"$service_json")"
          [[ "$deployed_image" == "$expected_image" ]] \
            || fail_check "container image must be the copied Artifact Registry digest" "$deployed_image"

          max_scale="$(jq -r '.spec.template.metadata.annotations["autoscaling.knative.dev/maxScale"] // ""' <<<"$service_json")"
          [[ "$max_scale" == "1" ]] \
            || fail_check "maxScale annotation must be exactly 1 (no autoscaling default)" "${max_scale:-absent}"
          min_scale="$(jq -r '.spec.template.metadata.annotations["autoscaling.knative.dev/minScale"] // "0"' <<<"$service_json")"
          [[ "$min_scale" == "0" ]] \
            || fail_check "minScale annotation must resolve to 0" "$min_scale"
          container_concurrency="$(jq -r '.spec.template.spec.containerConcurrency // -1' <<<"$service_json")"
          [[ "$container_concurrency" == "8" ]] \
            || fail_check "containerConcurrency must be 8" "$container_concurrency"

          expected_service_account="babyjamjam-preview-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          deployed_service_account="$(jq -r '.spec.template.spec.serviceAccountName // ""' <<<"$service_json")"
          [[ "$deployed_service_account" == "$expected_service_account" ]] \
            || fail_check "serviceAccountName must be the preview runtime identity" "$deployed_service_account"

          plain_env_value() {
            jq -r --arg name "$1" \
              '[.spec.template.spec.containers[0].env[]? | select(.name == $name)][0]
               | if . == null then "<missing>" elif .valueFrom != null then "<secretKeyRef>" else (.value // "<absent>") end' \
              <<<"$service_json"
          }
          schedulers_enabled="$(plain_env_value SCHEDULERS_ENABLED)"
          [[ "$schedulers_enabled" == "false" ]] \
            || fail_check "SCHEDULERS_ENABLED must be the plain value 'false'" "$schedulers_enabled"
          lease_mode_env="$(plain_env_value SCHEDULER_LEASE_MODE)"
          [[ "$lease_mode_env" == "off" ]] \
            || fail_check "SCHEDULER_LEASE_MODE must be the plain value 'off'" "$lease_mode_env"

          # Aligo is disabled on preview (operator decision 2026-09-23): the key
          # must exist as a plain empty value, never as a Secret Manager ref.
          aligo_state="$(jq -r --arg name "ALIGO_API_KEY" \
            '[.spec.template.spec.containers[0].env[]? | select(.name == $name)][0]
             | if . == null then "<missing>" elif .valueFrom != null then "<secretKeyRef>" elif (.value // "") == "" then "<plain-empty>" else "<plain-non-empty>" end' \
            <<<"$service_json")"
          [[ "$aligo_state" == "<plain-empty>" ]] \
            || fail_check "ALIGO_API_KEY must be a plain empty value (Aligo disabled on preview)" "$aligo_state"

          {
            echo "SERVICE_URL=$(jq -r '.status.url // ""' <<<"$service_json")"
            echo "DEPLOYED_REVISION=${latest_ready}"
          } >> "$GITHUB_ENV"

      - name: Smoke the service health endpoints
        run: |
          set -euo pipefail
          if [[ -z "$SERVICE_URL" ]]; then
            echo "::error::Cloud Run did not report a service URL"
            exit 1
          fi

          # No -f and `|| true`: the first requests pay the cold start and may
          # fail; only the final state after the whole retry window is fatal.
          health_code="0"
          for _attempt in $(seq 1 18); do
            health_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$SERVICE_URL/health/ready" || true)"
            if [[ "$health_code" == "200" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "$health_code" != "200" ]]; then
            echo "::error::/health/ready never returned 200 within the retry window (last status: $health_code)"
            exit 1
          fi

          # ADR-010: with SCHEDULERS_ENABLED=false the lease mode resolves to
          # "standby" (resolveSchedulerLeaseMode) and a passive host must never
          # hold the background-owner lease. /health/lease answers 200 always.
          if ! curl -sS --max-time 10 "$SERVICE_URL/health/lease" \
              | jq -e '.mode == "standby" and .held == false' >/dev/null; then
            echo "::error::/health/lease must report mode 'standby' with held=false"
            exit 1
          fi

      - name: Write the deployment summary
        run: |
          set -euo pipefail
          {
            printf '%s\n' "## Preview backend deployed to Cloud Run (BJJ-341)"
            printf -- '- Service URL: %s\n' "$SERVICE_URL"
            printf -- '- Revision: %s\n' "$DEPLOYED_REVISION"
            printf -- '- AR image: %s@%s\n' "$AR_IMAGE" "$AR_DIGEST"
            printf -- '- Source GHCR image: %s@%s\n' "$GHCR_IMAGE" "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-lightsail:
    name: deploy Lightsail backend
    if: >-
      always() &&
      github.event_name == 'push' &&
      (github.ref_name == 'preview' || github.ref_name == 'main') &&
      needs.build-lightsail-image.result == 'success' &&
      needs.resolve-backend-deploy-target.result == 'success' &&
      needs.resolve-backend-deploy-target.outputs.target == 'lightsail'
    needs: [build-lightsail-image, resolve-backend-deploy-target]
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: lightsail-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      AWS_REGION: ap-northeast-2
      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      EXPECTED_SCHEDULERS_ENABLED: ${{ github.ref_name == 'main' && 'true' || 'false' }}
      IMAGE_DIGEST: ${{ needs.build-lightsail-image.outputs.digest }}
      AWS_DEPLOY_ROLE_ARN: ${{ github.ref_name == 'main' && vars.AWS_PRODUCTION_DEPLOY_ROLE_ARN || vars.AWS_PREVIEW_DEPLOY_ROLE_ARN }}
      AWS_DEPLOY_DOCUMENT_NAME: ${{ github.ref_name == 'main' && vars.AWS_PRODUCTION_DEPLOY_DOCUMENT_NAME || vars.AWS_PREVIEW_DEPLOY_DOCUMENT_NAME }}
      LIGHTSAIL_SSM_TARGET_TAG: ${{ vars.LIGHTSAIL_SSM_TARGET_TAG }}

    steps:
      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$AWS_DEPLOY_DOCUMENT_NAME" =~ ^[A-Za-z0-9_.-]{1,128}$ ]]
          [[ "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,512}$ ]]
          [[ "$LIGHTSAIL_SSM_TARGET_TAG" =~ ^[A-Za-z0-9._:/=+@-]{1,128}$ ]]

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Deploy through AWS Systems Manager
        run: |
          set -euo pipefail

          parameters="$(jq -cn \
            --arg commit_sha "$GITHUB_SHA" \
            --arg image_digest "$IMAGE_DIGEST" \
            '{CommitSha:[$commit_sha],ImageDigest:[$image_digest]}')"
          targets="$(jq -cn \
            --arg tag_value "$LIGHTSAIL_SSM_TARGET_TAG" \
            '[{Key:"tag:DeploymentTarget",Values:[$tag_value]}]')"
          managed_nodes="$(aws ssm describe-instance-information \
            --filters "Key=tag:DeploymentTarget,Values=$LIGHTSAIL_SSM_TARGET_TAG" \
            --output json)"
          managed_node_count="$(jq '.InstanceInformationList | length' <<<"$managed_nodes")"
          online_node_count="$(jq '[.InstanceInformationList[] | select(.PingStatus == "Online")] | length' \
            <<<"$managed_nodes")"
          if [[ "$managed_node_count" -ne 1 || "$online_node_count" -ne 1 ]]; then
            echo "Deployment requires exactly one online managed node for the target tag." >&2
            exit 1
          fi
          expected_node_id="$(jq -r '.InstanceInformationList[0].InstanceId' <<<"$managed_nodes")"

          command_id="$(aws ssm send-command \
            --document-name "$AWS_DEPLOY_DOCUMENT_NAME" \
            --parameters "$parameters" \
            --targets "$targets" \
            --max-concurrency 1 \
            --max-errors 0 \
            --timeout-seconds 1800 \
            --comment "GitHub ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)"

          [[ "$command_id" =~ ^[0-9a-f-]{36}$ ]]
          managed_node_id=""
          final_status="TimedOut"

          emit_safe_ssm_output() {
            local stream_name="$1"
            local raw_output="$2"
            local lowercase_output
            local normalized_output

            normalized_output="$(printf '%s' "$raw_output" \
              | tr '\r\n\t' '   ' \
              | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//')"
            lowercase_output="$(printf '%s' "$normalized_output" | tr '[:upper:]' '[:lower:]')"

            if [[ -z "$normalized_output" \
              || ${#normalized_output} -gt 1024 \
              || "$normalized_output" == *"="* \
              || "$normalized_output" == *"://"* \
              || "$lowercase_output" =~ (authorization|bearer|credential|password|secret|token) ]]; then
              return 1
            fi

            printf 'SSM deployment %s: %s\n' "$stream_name" "$normalized_output" >&2
            return 0
          }

          report_ssm_failure() {
            local invocation_json
            local raw_stdout
            local raw_stderr
            local reported_output=false

            if [[ -z "$managed_node_id" || "$managed_node_id" != "$expected_node_id" ]]; then
              echo "SSM deployment error unavailable." >&2
              return
            fi

            if ! invocation_json="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$managed_node_id" \
              --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
              --output json 2>/dev/null)"; then
              echo "SSM deployment error unavailable." >&2
              return
            fi

            raw_stdout="$(jq -r '.stdout // ""' <<<"$invocation_json" 2>/dev/null || true)"
            raw_stderr="$(jq -r '.stderr // ""' <<<"$invocation_json" 2>/dev/null || true)"

            if emit_safe_ssm_output stdout "$raw_stdout"; then
              reported_output=true
            fi
            if emit_safe_ssm_output stderr "$raw_stderr"; then
              reported_output=true
            fi
            if [[ "$reported_output" != true ]]; then
              echo "SSM deployment error unavailable." >&2
            fi
          }

          for _attempt in $(seq 1 360); do
            invocation_json="$(aws ssm list-command-invocations \
              --command-id "$command_id" \
              --details \
              --output json)"
            invocation_count="$(jq '.CommandInvocations | length' <<<"$invocation_json")"
            if [[ "$invocation_count" -gt 1 ]]; then
              managed_node_id=""
              echo "Deployment target resolved to more than one managed node." >&2
              final_status="MultipleTargets"
              break
            fi
            if [[ "$invocation_count" -eq 0 ]]; then
              sleep 5
              continue
            fi

            managed_node_id="$(jq -r '.CommandInvocations[0].InstanceId' <<<"$invocation_json")"
            final_status="$(jq -r '.CommandInvocations[0].Status' <<<"$invocation_json")"
            case "$final_status" in
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              Success)
                break
                ;;
              *)
                break
                ;;
            esac
          done

          if [[ "$final_status" != "Success" || -z "$managed_node_id" ]]; then
            report_ssm_failure
            if [[ "$final_status" == "MultipleTargets" ]]; then
              echo "SSM deployment ended with multiple managed-node invocations." >&2
            elif [[ "$final_status" == "TimedOut" ]]; then
              echo "SSM deployment did not finish successfully before the timeout." >&2
            else
              echo "SSM deployment ended with status: $final_status" >&2
            fi
            exit 1
          fi
          if [[ "$managed_node_id" != "$expected_node_id" ]]; then
            echo "SSM deployment completed on an unexpected managed node." >&2
            exit 1
          fi

          status_output="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$managed_node_id" \
            --query 'StandardOutputContent' \
            --output text)"

          read_status_value() {
            local wanted_key="$1"
            awk -F= -v wanted_key="$wanted_key" '$1 == wanted_key { print substr($0, length($1) + 2) }' \
              <<<"$status_output"
          }

          deployed_environment="$(read_status_value environment)"
          deployed_tag="$(read_status_value current_tag)"
          deployed_digest="$(read_status_value current_digest)"
          container_health="$(read_status_value container_health)"
          restart_count="$(read_status_value restart_count)"
          schedulers_enabled="$(read_status_value schedulers_enabled)"
          lease_mode="$(read_status_value lease_mode)"
          lease_holder="$(read_status_value lease_holder)"
          public_health="$(read_status_value public_health)"
          db_route="$(read_status_value db_route)"
          runtime_route="$(read_status_value runtime_route)"
          db_readiness="$(read_status_value db_readiness)"

          [[ "$deployed_environment" == "$DEPLOY_ENVIRONMENT" ]]
          [[ "$deployed_tag" == "$GITHUB_SHA" ]]
          [[ "$deployed_digest" == "$IMAGE_DIGEST" ]]
          [[ "$container_health" == "healthy" ]]
          [[ "$restart_count" == "0" ]]
          [[ "$schedulers_enabled" == "$EXPECTED_SCHEDULERS_ENABLED" ]]
          # ADR-010: the scheduler-owning host must contest the lease as `lightsail`.
          if [[ "$EXPECTED_SCHEDULERS_ENABLED" == "true" ]]; then
            [[ "$lease_mode" == "required" ]]
            [[ "$lease_holder" == "lightsail" ]]
          fi
          [[ "$public_health" == "ok" ]]
          [[ "$db_route" == "shared" || "$db_route" == "direct" ]]
          [[ "$runtime_route" == "$db_route" ]]
          [[ "$db_readiness" == "ok" ]]

          printf '%s\n' \
            "environment=$deployed_environment" \
            "current_tag=$deployed_tag" \
            "current_digest=$deployed_digest" \
            "container_health=$container_health" \
            "restart_count=$restart_count" \
            "schedulers_enabled=$schedulers_enabled" \
            "lease_mode=$lease_mode" \
            "lease_holder=$lease_holder" \
            "public_health=$public_health" \
            "db_route=$db_route" \
            "runtime_route=$runtime_route" \
            "db_readiness=$db_readiness"

  deploy-lightnode:
    name: deploy LightNode fallback backend
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      needs.build-lightsail-image.result == 'success' &&
      needs.resolve-backend-deploy-target.result == 'success' &&
      needs.resolve-backend-deploy-target.outputs.target == 'lightnode'
    needs: [build-lightsail-image, resolve-backend-deploy-target]
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: lightsail-deploy-main
      cancel-in-progress: false
    env:
      IMAGE_DIGEST: ${{ needs.build-lightsail-image.outputs.digest }}
      LIGHTNODE_CI_HOST: ${{ secrets.LIGHTNODE_CI_HOST }}
      LIGHTNODE_CI_SSH_PRIVATE_KEY: ${{ secrets.LIGHTNODE_CI_SSH_PRIVATE_KEY }}
      LIGHTNODE_CI_KNOWN_HOSTS: ${{ secrets.LIGHTNODE_CI_KNOWN_HOSTS }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Connect an ephemeral deployment node to the tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: babyjamjam-backend-ci

      - name: Configure restricted LightNode SSH
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$LIGHTNODE_CI_HOST" =~ ^[A-Za-z0-9.-]{1,253}$ ]]
          [[ -n "$LIGHTNODE_CI_SSH_PRIVATE_KEY" && -n "$LIGHTNODE_CI_KNOWN_HOSTS" ]]
          umask 077
          install -d "$RUNNER_TEMP/lightnode-ssh"
          printf '%s\n' "$LIGHTNODE_CI_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/lightnode-ssh/id"
          printf '%s\n' "$LIGHTNODE_CI_KNOWN_HOSTS" > "$RUNNER_TEMP/lightnode-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/lightnode-ssh/id" >/dev/null
          ssh-keygen -F "$LIGHTNODE_CI_HOST" -f "$RUNNER_TEMP/lightnode-ssh/known_hosts" >/dev/null

      - name: Replace the active LightNode release
        run: |
          set -euo pipefail
          ssh_base=(
            ssh
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/lightnode-ssh/known_hosts"
            -o ConnectTimeout=10
            -i "$RUNNER_TEMP/lightnode-ssh/id"
            "babyjamjam-ci-deployer@$LIGHTNODE_CI_HOST"
          )
          # Each status key must appear exactly once; a missing or duplicated
          # key is a contract violation and must fail with a visible reason.
          read_status_value() {
            local wanted_key="$1"
            awk -F= -v wanted_key="$wanted_key" '
              $1 == wanted_key { count += 1; value = substr($0, length($1) + 2) }
              END { if (count == 1 && value != "") print value; else exit 1 }' \
              <<<"$status_output"
          }
          expect_status() {
            local wanted_key="$1" expected="$2" actual
            if ! actual="$(read_status_value "$wanted_key")"; then
              echo "::error::LightNode status key '$wanted_key' is missing or duplicated"
              printf '%s\n' "$status_output"
              exit 1
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::LightNode status '$wanted_key' is '$actual' (expected '$expected')"
              exit 1
            fi
          }

          status_output="$("${ssh_base[@]}" 'status')"
          expect_status environment fallback-server
          expect_status runtime_mode temporary-active
          expect_status container_health healthy
          expect_status restart_count 0
          expect_status production_db_identity ok
          expect_status public_routing fallback
          expect_status schedulers_enabled true
          expect_status document_jobs_accepting true
          expect_status document_jobs_worker true

          status_output="$("${ssh_base[@]}" "replace $GITHUB_SHA $IMAGE_DIGEST")"
          expect_status current_tag "$GITHUB_SHA"
          expect_status current_digest "$IMAGE_DIGEST"
          expect_status container_health healthy
          expect_status restart_count 0
          expect_status public_routing fallback
          # ADR-010: a temporary-active fallback contests the lease. Only asserted
          # after replace (the pre-replace release may predate /health/lease), and
          # only the mode: lease_held may legitimately be false while Lightsail holds it.
          expect_status lease_mode required
          curl --fail --silent --show-error --connect-timeout 3 --max-time 10 \
            https://api.babyjamjam.com/health/ready >/dev/null
          printf '%s\n' \
            "environment=fallback-server" \
            "current_tag=$GITHUB_SHA" \
            "current_digest=$IMAGE_DIGEST" \
            "container_health=healthy" \
            "restart_count=0" \
            "public_routing=fallback" \
            "schedulers_enabled=true" \
            "lease_mode=required"
