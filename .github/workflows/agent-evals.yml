name: Agent evaluations

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model identifier to record with the evaluation
        required: false
        type: string
      jev_evaluation:
        description: Jev evaluation to run (off = skip; fixture = offline network-free report; live = pinned-model provider calls, needs consent + TYPESAFE_API_KEY)
        required: false
        default: "off"
        type: choice
        options:
          - "off"
          - fixture
          - live

permissions:
  contents: read

jobs:
  release-a:
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ vars.AGENT_EVAL_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - name: Evaluate the deployed runtime and model
        run: TS_NODE_COMPILER_OPTIONS='{"module":"commonjs"}' pnpm --filter ./backend exec ts-node ../evals/agent/run-evaluation.ts
        env:
          AGENT_MODEL: ${{ inputs.model }}
          AGENT_EVAL_LIVE: '1'
          AGENT_EVAL_BASE_URL: ${{ vars.AGENT_EVAL_BASE_URL }}
          AGENT_EVAL_ALLOWED_ORIGIN: ${{ vars.AGENT_EVAL_ALLOWED_ORIGIN }}
          AGENT_EVAL_TOKEN: ${{ secrets.AGENT_EVAL_TOKEN }}
          AGENT_EVAL_LOW_PRIVILEGE_TOKEN: ${{ secrets.AGENT_EVAL_LOW_PRIVILEGE_TOKEN }}
          AGENT_EVAL_OTHER_BRANCH_TOKEN: ${{ secrets.AGENT_EVAL_OTHER_BRANCH_TOKEN }}
          AGENT_EVAL_FORBIDDEN_MARKER: ${{ secrets.AGENT_EVAL_FORBIDDEN_MARKER }}
          AGENT_EVAL_ALLOWED_MARKER: ${{ secrets.AGENT_EVAL_ALLOWED_MARKER }}
          AGENT_EVAL_CLIENT_ENTITY_MARKER: ${{ secrets.AGENT_EVAL_CLIENT_ENTITY_MARKER }}
          AGENT_EVAL_EMPLOYEE_ENTITY_MARKER: ${{ secrets.AGENT_EVAL_EMPLOYEE_ENTITY_MARKER }}
          AGENT_EVAL_PROVIDER_LEDGER_URL: ${{ secrets.AGENT_EVAL_PROVIDER_LEDGER_URL }}
          AGENT_EVAL_PROVIDER_LEDGER_TOKEN: ${{ secrets.AGENT_EVAL_PROVIDER_LEDGER_TOKEN }}
          AGENT_EVAL_UNCERTAIN_ACTION_ID: ${{ secrets.AGENT_EVAL_UNCERTAIN_ACTION_ID }}
          AGENT_EVAL_CONTRACT_CLIENT_ID: ${{ secrets.AGENT_EVAL_CONTRACT_CLIENT_ID }}
          AGENT_EVAL_CONTRACT_TEMPLATE_ID: ${{ secrets.AGENT_EVAL_CONTRACT_TEMPLATE_ID }}
          AGENT_EVAL_SMS_RECEIVER: ${{ secrets.AGENT_EVAL_SMS_RECEIVER }}
          AGENT_EVAL_SCHEDULED_SMS_RECEIVER: ${{ secrets.AGENT_EVAL_SCHEDULED_SMS_RECEIVER }}
          AGENT_EVAL_RETRY_JOB_ID: ${{ secrets.AGENT_EVAL_RETRY_JOB_ID }}
          AGENT_EVAL_NOTIFICATION_USER_ID: ${{ secrets.AGENT_EVAL_NOTIFICATION_USER_ID }}
          AGENT_EVAL_AUTOMATION_RULE_NAME: ${{ secrets.AGENT_EVAL_AUTOMATION_RULE_NAME }}
          AGENT_EVAL_SIDE_EFFECT_CONFIRMATION: ${{ secrets.AGENT_EVAL_SIDE_EFFECT_CONFIRMATION }}
          AGENT_EVAL_OUTPUT: ../artifacts/agent-eval.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: agent-evaluation-${{ github.sha }}
          path: artifacts/agent-eval.json
          if-no-files-found: error
          retention-days: 30

  # Offline, network-free corpus certification: validates fixtures-v1.json and
  # the judge rubric, then writes the versioned fixture report. Never
  # constructs a provider client. Default dispatch (jev_evaluation=off)
  # skips this job, so ordinary dispatch behavior is unchanged.
  jev-fixture:
    runs-on: ubuntu-latest
    if: ${{ inputs.jev_evaluation == 'fixture' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - name: Run the offline Jev fixture evaluation (no provider calls)
        run: TS_NODE_COMPILER_OPTIONS='{"module":"commonjs"}' pnpm --filter ./backend exec ts-node scripts/agent/run-jev-evaluation.ts --mode=fixture --input=../evals/agent/jev/fixtures-v1.json --output=../artifacts/jev-fixture-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: jev-fixture-evaluation-${{ github.sha }}
          path: artifacts/jev-fixture-report.json
          if-no-files-found: error
          retention-days: 30

  # Live Jev evaluation against the pinned model. Separately gated: runs only
  # on an explicit manual dispatch with jev_evaluation=live, inside the
  # preview environment that holds TYPESAFE_API_KEY (referenced, never
  # printed). Not wired to PR or push events. The CLI additionally
  # enforces --consent=live-provider-call, a synthetic-only corpus inside
  # evals/agent/jev/, and the pinned model id.
  jev-live:
    runs-on: ubuntu-latest
    if: ${{ inputs.jev_evaluation == 'live' }}
    environment:
      name: preview
      url: ${{ vars.AGENT_EVAL_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile
      - name: Run the consented live Jev evaluation against the pinned model
        run: TS_NODE_COMPILER_OPTIONS='{"module":"commonjs"}' pnpm --filter ./backend exec ts-node scripts/agent/run-jev-evaluation.ts --mode=live --consent=live-provider-call --input=../evals/agent/jev/fixtures-v1.json --output=../artifacts/jev-live-report.json
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: jev-live-evaluation-${{ github.sha }}
          path: artifacts/jev-live-report.json
          if-no-files-found: error
          retention-days: 30
