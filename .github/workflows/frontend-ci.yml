name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [ main, dev, preview, "feature/**", "fix/**", "ci/**" ]
    paths:
      - 'frontend/**'
      - 'packages/shared/**'
      - 'packages/service-record-ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/ci/**'
      - '.github/workflows/ci-impact.yml'
      - '.github/workflows/frontend-ci.yml'
  # No paths filter on pull_request: this job is a REQUIRED check on dev,
  # so it must report on every PR — path-filtered required checks block
  # merges as eternally "expected" when the paths don't match.
  pull_request:
    branches: [ main, dev, preview, "feature/**", "fix/**", "ci/**" ]
  merge_group:

permissions:
  contents: read

jobs:
  impact:
    uses: ./.github/workflows/ci-impact.yml
    with:
      component: frontend

  checks:
    name: frontend application checks
    needs: impact
    if: needs.impact.outputs.frontend == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The e2e copy drift gate diffs against a base commit; the default
          # depth-1 checkout has no history for it to resolve and the gate
          # would silently skip.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail fast on the cheapest, most deterministic gate first.
      - name: Type check
        run: pnpm --filter ./frontend run type-check

      - name: Lint
        run: pnpm --filter ./frontend run lint

      - name: data-component re-entry guard
        run: |
          if grep -rln '\[data-component' frontend/src --include='*.css'; then
            echo '::error::CSS must not select on data-component — use data-slot or a semantic class'; exit 1
          fi
          if grep -rln 'querySelector([^)]*\[data-component' frontend/src --include='*.ts' --include='*.tsx' \
            | grep -v -e '\.test\.' -e '__tests__'; then
            echo '::error::Imperative DOM hooks must not target data-component — use data-slot'; exit 1
          fi

      - name: UI architecture gate
        run: pnpm lint:ui-architecture --platform frontend

      # Reworded UI copy is invisible to the unit tests below — the Playwright
      # specs that assert it only run in the e2e job, against a seeded backend.
      # This catches a stale assertion here in seconds instead of there in
      # minutes. Repo-wide, so it also covers mobile when only this job runs.
      - name: e2e copy drift gate
        run: |
          # A pull request compares against its own base; a push against the
          # head it replaced. Defaulting to origin/dev would compare a dev push
          # to the very commit under test.
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) BASE="HEAD~1" ;;
          esac
          pnpm lint:e2e-strings --base "$BASE"

      - name: Unit tests
        run: pnpm --filter ./frontend test
        env:
          CI: true

      - name: Build
        run: pnpm --filter ./frontend run build

  verify:
    name: frontend · type-check · lint · test · build
    needs: [impact, checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Protected-base completion (FULL bootstrap requires success)
        env:
          IMPACT_MODE: gate
          COMPONENT: frontend
          IMPACT_RESULT: ${{ needs.impact.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          REPORTED_SELECTION: ${{ needs.impact.outputs.frontend }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, mkdtempSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const env = process.env;
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' });
          const exact = sha => {
            if (!/^[0-9a-f]{40}$/.test(sha ?? '') || /^0+$/.test(sha)) throw new Error('Invalid exact event commit');
            try { git('cat-file', '-e', `${sha}^{commit}`); }
            catch { git('fetch', '--no-tags', 'origin', sha); }
            if (git('rev-parse', '--verify', `${sha}^{commit}`).trim() !== sha) throw new Error('Unresolved event commit');
            return sha;
          };
          const event = JSON.parse(readFileSync(env.GITHUB_EVENT_PATH, 'utf8'));
          const compared = ['pull_request', 'merge_group'].includes(env.GITHUB_EVENT_NAME);
          const base = compared ? exact(env.GITHUB_EVENT_NAME === 'pull_request' ? event.pull_request?.base?.sha : event.merge_group?.base_sha) : null;
          const head = compared ? exact(env.GITHUB_EVENT_NAME === 'pull_request' ? event.pull_request?.head?.sha : event.merge_group?.head_sha) : exact(env.GITHUB_SHA);
          const sha = exact(env.GITHUB_SHA);
          const helper = 'scripts/ci/impact.mjs';
          // A successful tree listing distinguishes absence from git/read failure.
          const entries = base ? git('ls-tree', base, '--', helper).trim() : '';
          if (entries) {
            if (!/^100644 blob [0-9a-f]{40}\t/.test(entries)) throw new Error('Trusted helper is not a regular blob');
            const directory = mkdtempSync(join(env.RUNNER_TEMP, 'protected-impact-'));
            const executable = join(directory, 'impact.mjs');
            writeFileSync(executable, git('show', `${base}:${helper}`), { mode: 0o600 });
            // No candidate module path, imports, packages or fallback helpers are executed.
            const artifact = join(directory, 'impact.json');
            const proof = join(directory, 'completed');
            execFileSync(process.execPath, [executable], { env: { ...env, IMPACT_ARTIFACT: artifact, IMPACT_COMPLETION_PROOF: proof }, stdio: 'inherit' });
            if (env.IMPACT_MODE === 'gate') {
              if (readFileSync(proof, 'utf8') !== 'protected-complete\n') throw new Error('Missing protected completion proof');
            } else {
              const routing = JSON.parse(readFileSync(artifact, 'utf8'));
              if (routing.schemaVersion !== 1 || routing.candidate?.sha !== sha || routing.candidate?.base !== base || routing.candidate?.head !== head || !['backend', 'frontend', 'mobile'].every(app => typeof routing.selected?.[app] === 'boolean')) throw new Error('Missing/invalid protected routing artifact');
              writeFileSync(env.IMPACT_ARTIFACT, JSON.stringify(routing, null, 2) + '\n');
            }
          } else {
            // Workflow-owned bootstrap also handles push/manual: FULL only, never exemptions.
            const reason = compared ? 'Protected base predates impact helper: bootstrap FULL' : `${env.GITHUB_EVENT_NAME}: FULL; no exemptions`;
            const selected = { backend: true, frontend: true, mobile: true };
            if (env.IMPACT_MODE === 'gate') {
              if (!Object.hasOwn(selected, env.COMPONENT) || env.IMPACT_RESULT !== 'success' || env.REPORTED_SELECTION !== 'true' || env.CHECKS_RESULT !== 'success') throw new Error('FULL completion requires successful selected checks and impact');
            } else {
              const routing = { schemaVersion: 1, candidate: { event: env.GITHUB_EVENT_NAME, sha, base, head, mergeBase: null }, comparison: { kind: 'full', reason }, paths: [], categories: { ...selected, shared: true, native: true, infra: true, docs: false, dependencies: true, config: true, uncertain: true }, selected, reasons: [reason], qa: { status: 'assessment-required', reasons: ['Full/unknown impact requires Main browser-impact assessment'] } };
              writeFileSync(env.IMPACT_ARTIFACT, JSON.stringify(routing, null, 2) + '\n');
              for (const app of Object.keys(selected)) appendFileSync(env.GITHUB_OUTPUT, `${app}=true\n`);
              appendFileSync(env.GITHUB_STEP_SUMMARY, `## CI impact\n\n\`\`\`json\n${JSON.stringify(routing, null, 2)}\n\`\`\`\n`);
            }
          }
          NODE
